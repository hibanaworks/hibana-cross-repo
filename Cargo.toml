[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "e94a5c53358bf27b56f632cff8e869ded3913d93", default-features = false, features = ["std"] }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "9ba7500528bf05f9228a5b63b5cf3425284d1e1c", default-features = false, features = ["std"] }
hibana-mgmt = { git = "https://github.com/hibanaworks/hibana-mgmt", rev = "9bf36eb4d48ed90933b95211eb38b7c7ed17eb31", default-features = false, features = ["std"] }
