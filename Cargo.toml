[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "ebeddd96956912dc79d528c1bb0537c28f646ad1", default-features = false, features = ["std"] }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "f47c5c59ef1c42c20644fd0a8d76add9b23b8851", default-features = false, features = ["std"] }
hibana-mgmt = { git = "https://github.com/hibanaworks/hibana-mgmt", rev = "90ff20f0fbd5de5b6d1cd81b47e74602b16a7494", default-features = false, features = ["std"] }
