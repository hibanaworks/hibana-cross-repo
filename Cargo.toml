[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "5b0a522a85694718743b19caa1cadb470cf3a22d", default-features = false, features = ["std"] }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "e0a977bf969baa9aa63d6879e9878a4af80e796c", default-features = false, features = ["std"] }
hibana-mgmt = { git = "https://github.com/hibanaworks/hibana-mgmt", rev = "3c94bcd1e955b2816d97c1e2d485fb27a0ae11d1", default-features = false, features = ["std"] }
