[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "53fe08fe5169fd5bb2f3012ef83e1ac8a221b081", default-features = false, features = ["std"] }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "2f4fd88c64c7acf8fc31a5f27a0cbdb6872df1fd", default-features = false, features = ["std"] }
hibana-mgmt = { git = "https://github.com/hibanaworks/hibana-mgmt", rev = "72f7813ead74dea13bc3d1a096c467af5427e915", default-features = false, features = ["std"] }
