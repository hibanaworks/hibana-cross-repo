[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "8f347b5becf03cdcbc3a6a0e6170e846058f36d0", default-features = false, features = ["std"] }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "ae2ba786c0db2ddccc59871fd577c8f66a2cba23", default-features = false, features = ["std"] }
hibana-mgmt = { git = "https://github.com/hibanaworks/hibana-mgmt", rev = "e87ed6d1e995ebea31c848d8858b940b2bac4b83", default-features = false, features = ["std"] }
