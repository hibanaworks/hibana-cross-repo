[package]
name = "hibana-cross-repo-smoke"
version = "0.1.0"
edition = "2024"
description = "Dedicated cross-repo smoke harness for hibana sibling crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-cross-repo"
homepage = "https://github.com/hibanaworks/hibana-cross-repo"
readme = "README.md"
publish = false

[features]
default = []

[dependencies]
hibana = { version = "0.1.0", path = "../hibana", default-features = false, features = ["std"] }
hibana-epf = { version = "0.1.0", path = "../hibana-epf", default-features = false, features = ["std"] }
hibana-mgmt = { version = "0.1.0", path = "../hibana-mgmt", default-features = false, features = ["std"] }
